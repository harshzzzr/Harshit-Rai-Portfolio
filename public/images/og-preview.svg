<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="40%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>

    <!-- Radial Glow Behind Brand -->
    <radialGradient id="radialGlow" cx="25%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#070b14" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Radial Glow -->
  <rect width="1200" height="630" fill="url(#radialGlow)" />

  <!-- Grid Overlay -->
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Card Border Inset -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Top Status Badge -->
  <g transform="translate(80, 80)">
    <rect width="320" height="44" rx="22" fill="#0369a1" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="26" cy="22" r="6" fill="#10b981" />
    <text x="46" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#7dd3fc" letter-spacing="1">AVAILABLE FOR COLLABORATION</text>
  </g>

  <!-- Top Right Code Monogram Icon -->
  <g transform="translate(1030, 70)">
    <rect width="90" height="90" rx="24" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <g fill="none" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 28 35 L 18 45 L 28 55" />
      <path d="M 62 35 L 72 45 L 62 55" />
    </g>
    <text x="45" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">HR</text>
  </g>

  <!-- Main Headline / Name -->
  <g transform="translate(80, 240)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#38bdf8" letter-spacing="3">COMPUTER ENGINEERING &amp; SOFTWARE SYSTEMS</text>
    <text x="0" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="80" font-weight="900" fill="#ffffff" letter-spacing="-1.5">HARSHIT RAI</text>
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="500" fill="#94a3b8">Developer Portfolio • Full-Stack Systems &amp; Algorithmic Problem Solving</text>
  </g>

  <!-- Technical Competency Chips -->
  <g transform="translate(80, 440)">
    <!-- Chip 1 -->
    <g transform="translate(0, 0)">
      <rect width="120" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="60" y="26" font-family="monospace" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle">C++</text>
    </g>
    <!-- Chip 2 -->
    <g transform="translate(136, 0)">
      <rect width="130" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="65" y="26" font-family="monospace" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle">React.js</text>
    </g>
    <!-- Chip 3 -->
    <g transform="translate(282, 0)">
      <rect width="130" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="65" y="26" font-family="monospace" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle">Node.js</text>
    </g>
    <!-- Chip 4 -->
    <g transform="translate(428, 0)">
      <rect width="160" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="80" y="26" font-family="monospace" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle">Algorithms</text>
    </g>
    <!-- Chip 5 -->
    <g transform="translate(604, 0)">
      <rect width="190" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="95" y="26" font-family="monospace" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle">Relational DB</text>
    </g>
  </g>

  <!-- Bottom Bar with URL -->
  <g transform="translate(80, 535)">
    <!-- Divider Line -->
    <line x1="0" y1="0" x2="1040" y2="0" stroke="#334155" stroke-opacity="0.6" stroke-width="1" />
    <!-- Domain Tag -->
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#38bdf8" letter-spacing="1">HarshitRai.com</text>
    <!-- Right side branding -->
    <text x="1040" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#64748b" text-anchor="end">Official Developer Portfolio &amp; Engineering Showcase</text>
  </g>
</svg>
