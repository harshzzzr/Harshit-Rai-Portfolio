<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <!-- Subtle inner border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />
  <!-- Code Monogram <HR /> -->
  <g fill="none" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left angle bracket < -->
    <path d="M 15 25 L 8 32 L 15 39" />
    <!-- Right angle bracket > -->
    <path d="M 49 25 L 56 32 L 49 39" />
  </g>
  <!-- Monogram text HR -->
  <text x="32" y="38"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="18"
        font-weight="800"
        letter-spacing="-0.5"
        fill="#ffffff"
        text-anchor="middle">HR</text>
  <!-- Live status indicator dot -->
  <circle cx="50" cy="14" r="3.5" fill="#10b981" />
</svg>
